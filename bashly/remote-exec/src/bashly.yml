name: remote-exec
help: Rsync the current project directory to a scratch location on a remote host, then run a command there
version: 0.1.0

environment_variables:
- name: remote_exec_host
  help: "Remote ssh host -- beats the config file, but not --host"
- name: remote_exec_root
  help: "Remote scratch root -- beats the config file, but not --root"
- name: remote_exec_config
  help: "Config file (default: ${XDG_CONFIG_HOME:-~/.config}/remote-exec/config.ini). INI keys 'host'/'root' set the global defaults; the same keys under a [mvn] or [exec] section override them for that command only. Built-in defaults: host=kiwi, root=/tmp/remote-exec"

flags:
- long: --host
  arg: host
  help: "Remote ssh host (default: \\$REMOTE_EXEC_HOST, else the config file, else kiwi)"
- long: --root
  arg: root
  help: "Remote scratch root (default: \\$REMOTE_EXEC_ROOT, else the config file, else /tmp/remote-exec); this directory's own absolute local path gets appended to it, resolved relative to the remote host's \\$HOME unless it's absolute"
- long: --dry-run
  short: -n
  help: Pass -n (and -v) to rsync to preview the sync, then stop -- the remote command is skipped entirely

commands:
# Run `eval "$(remote-exec completions)"` to enable completions in the current shell.
- name: completions
  help: Print a bash completions script
  args:
  - name: shell
    help: Shell to generate completions for (only bash is currently supported)
    allowed: [bash]
    default: bash

- name: mvn
  help: "Run Maven remotely: ./mvnw if present locally, else the remote host's own system mvn"
  catch_all:
    label: MAVEN_GOAL
    help: "Maven goals/args to run remotely (default: dependency:resolve-sources dependency:go-offline)"
  examples:
  - remote-exec mvn
  - remote-exec mvn package -DskipTests
  - remote-exec --dry-run mvn

- name: exec
  help: Run an arbitrary command remotely, verbatim -- no defaulting, unlike 'mvn'
  default: true
  catch_all:
    label: COMMAND
    help: The command (and its args) to run remotely
    required: true
  examples:
  - remote-exec ls -la
  - remote-exec -- mvn --version
  - remote-exec exec mvn --version

- name: clean
  help: "Remove this directory's remote scratch copy on every host/root on record for it or any of its parents (so in a subfolder, only that subfolder is removed remotely), plus any now-empty remote parents up to the root; history entries whose remote copy is gone afterwards are dropped from the history file next to the config file -- skips rsync entirely. --host/--root (or \\$REMOTE_EXEC_HOST/\\$REMOTE_EXEC_ROOT) clean only the matching copies; the config file doesn't narrow it down"
  flags:
  - long: --all
    short: -a
    help: Clean every recorded copy as a whole, regardless of the current directory (still narrowed down by --host/--root)
  examples:
  - remote-exec clean
  - remote-exec --host kiwi clean
  - remote-exec --dry-run clean
  - remote-exec --dry-run --host kiwi clean --all
