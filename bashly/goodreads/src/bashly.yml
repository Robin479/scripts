name: goodreads
help: Interact with goodreads.com
version: 0.1.0

flags:
- long: --data-path
  arg: path
  help: "Root directory for cached data and login sessions (default: $GOODREADS_DATA, or ~/.goodreads)"
- long: --offline
  help: Skip live network checks and use only cached data

commands:
# Run `eval "$(goodreads completions)"` to enable completions in the current shell.
- name: completions
  help: Print a bash completions script
  args:
  - name: shell
    help: Shell to generate completions for (only bash is currently supported)
    allowed: [bash]
    default: bash
- name: auth
  help: Manage goodreads.com login sessions
  commands:
  - name: import
    help: Start a session by importing cookies exported from a browser login
    args:
    - name: cookie_file
      required: true
      help: Path to a Netscape-format cookie file for goodreads.com
  - name: status
    help: Show an account's session state (defaults to the current account)
    args:
    - name: account
      help: Account id (defaults to the current account)
  - name: list
    alias: ls
    help: List all known accounts
    default: force
  - name: switch
    help: Make a different known account the current one
    args:
    - name: account
      required: true
      help: Account id, as shown by 'auth list'
  - name: logout
    help: "Invalidate a session's cookies (defaults to the current account)"
    args:
    - name: account
      help: Account id (defaults to the current account)
- name: blogs
  help: Manage the local cache of scraped goodreads.com blog posts
  commands:
  - name: fetch
    help: "Fetch blog posts, discovering new ones, unless specific IDs are given."
    args:
    - name: blog_id
      repeatable: true
      help: "Fetch these specific blog posts (already-cached ones are skipped unless --update is given)"
    flags:
    - long: --all
      short: -A
      help: "Discover new blog posts, and check every already-cached one too (its infinite cache TTL means this only ever reports it as fresh, unless --update is also given)"
    - long: --update
      short: -U
      help: "Force-refresh explicitly given ids that are already cached, or, combined with --all, every already-cached post -- the only way to detect one's since been removed remotely"
    - long: --batch
      short: -B
      help: Suppress the self-updating status line (plain output, suitable for logs/pipes)
  - name: list
    alias: ls
    help: "List cached blog posts, most recent first (last 15 by default)"
    default: force
    args:
    - name: blog_id
      repeatable: true
      help: Only list these specific blog post ids (bypasses the default limit)
    flags:
    - long: --all
      short: -a
      help: Show every cached post (mutually exclusive with --since/--until/--limit)
    - long: --since
      short: -s
      arg: date
      help: Only posts on or after this date (with --limit, the n oldest)
    - long: --until
      short: -u
      arg: date
      help: Only posts on or before this date (with --limit, the n newest)
    - long: --reverse
      short: -r
      help: Reverse the display order
    - long: --limit
      short: -l
      arg: n
      help: "Show n posts instead of 15 (not with --all, or both --since+--until)"
    # args: has no per-argument completions: (only command:/flag: support
    # it), so this is attached to the command instead. $GOODREADS_DATA/
    # ~/.goodreads only -- ignores a --data-path given elsewhere on the
    # command line (would need parsing COMP_WORDS here).
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/blogs" 2>/dev/null | sed "s/\.json$//")'
  - name: get
    help: Print one blog post's books, prettily (fetches it first if not cached yet)
    args:
    - name: blog_id
      required: true
      help: Blog post id
    flags:
    - long: --json
      short: -J
      help: Print the raw cached JSON instead of a pretty book listing
    - long: --update
      short: -U
      help: Force updating this post even if already cached
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/blogs" 2>/dev/null | sed "s/\.json$//")'
  - name: challenge
    help: Manually flag (or unflag) blog posts as challenge listings
    args:
    - name: blog_id
      repeatable: true
      help: Blog post id(s) to mark
    flags:
    - long: --yes
      short: -y
      help: Mark these posts as challenge listings
    - long: --no
      short: -n
      help: Mark these posts as NOT challenge listings
    - long: --auto
      short: -a
      help: Remove the manual override, falling back to the machine-computed guess again
  - name: remove
    alias: rm
    help: Remove one or more blog posts from the local cache
    args:
    - name: blog_id
      repeatable: true
      help: Blog post id(s) to remove
    flags:
    - long: --all
      short: -a
      help: Remove every cached blog post
- name: books
  help: Manage the local cache of scraped goodreads.com book metadata
  commands:
  - name: fetch
    help: Fetch new books by id, or update already-cached ones
    args:
    - name: book_id
      repeatable: true
      help: "Fetch these specific book ids (already-cached ones are skipped unless --update is given)"
    flags:
    - long: --all
      short: -A
      help: "Check every already-cached book, refreshing only stale ones (per their cache TTL) unless --update is given"
    - long: --update
      short: -U
      help: "Force-refresh every explicitly given id (directly, via --blog, or via --challenge), or, combined with --all, every already-cached book -- bypassing the cache TTL entirely"
    - long: --blog
      short: -b
      arg: blog_id
      repeatable: true
      help: Fetch every book referenced by this blog post (see 'goodreads blogs list'); repeatable
      # Same dynamic-candidate convention as blogs list/books list, scoped
      # to this flag instead of a whole command (see CLAUDE.md).
      completions:
      - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/blogs" 2>/dev/null | sed "s/\.json$//")'
    - long: --challenge
      arg: challenge_id
      help: "Fetch every book referenced by any blog post linked to this challenge (see 'goodreads challenges get'); a book in multiple linked posts is only fetched once"
      completions:
      - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/challenges" 2>/dev/null | sed "s/\.json$//")'
    - long: --batch
      short: -B
      help: Suppress the self-updating status line (plain output, suitable for logs/pipes)
  - name: list
    alias: ls
    help: List cached books, sorted by title
    default: force
    args:
    - name: book_id
      repeatable: true
      help: Only list these specific book ids
    flags:
    - long: --limit
      short: -l
      arg: n
      help: Show at most n books (unlimited by default)
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/books" 2>/dev/null | sed "s/\.json$//")'
  - name: get
    help: Print one book's details (fetches or refreshes it first if needed)
    args:
    - name: book_id
      required: true
      help: Book id
    flags:
    - long: --json
      short: -J
      help: Print the raw cached JSON instead of a pretty summary
    - long: --update
      short: -U
      help: Force updating this book even if already cached and still within its cache TTL
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/books" 2>/dev/null | sed "s/\.json$//")'
  - name: remove
    alias: rm
    help: Remove one or more books from the local cache
    args:
    - name: book_id
      repeatable: true
      help: Book id(s) to remove
    flags:
    - long: --all
      short: -a
      help: Remove every cached book
- name: challenges
  help: Manually manage reading challenges (title, time window, badge-linked blog posts, book-count badges)
  commands:
  - name: create
    alias: new
    help: Create a new challenge
    flags:
    - long: --id
      arg: id
      help: "Manually specify the challenge id instead of auto-generating one (fails if already taken)"
    - long: --title
      arg: title
      help: "Challenge title (default: auto-named from the season, if the window qualifies -- else \"Unnamed Challenge\")"
    - long: --start
      arg: date
      help: "Start date, any format 'date -d' understands (default: right after the latest challenge if that's still recent, else the start of the current quarter)"
    - long: --end
      arg: date
      help: "End date, any format 'date -d' understands (default: the next quarter-end at least 6 weeks after --start)"
    - long: --badges
      arg: counts
      help: "Comma-separated book-count badges to add, each '<count>' or '<count>:<title>' (default: 2:Page-Turner,3:Speed Reader,5:Book Boss; pass an empty string for none, or see --no-badges)"
    - long: --badge
      arg: count:title
      repeatable: true
      help: "Add one book-count badge, as '<count>' or '<count>:<title>'; repeatable, alternative to --badges"
    - long: --no-badges
      help: "Add no book-count badges at all (overrides the default; superfluous, with a warning, alongside --badges/--badge)"
    - long: --blogs
      arg: blog_ids
      help: "Comma-separated blog posts to link, each '<id>' or '<id>:<title>' (default title: the post's own; default list: cached posts published from 1 week before --start to 2 weeks before --end with a challenge likeliness >= 0.7; pass an empty string for none). Every given post is fetched (cached or remotely) to confirm it exists"
    - long: --blog
      arg: id:title
      repeatable: true
      help: "Add one blog post, as '<id>' or '<id>:<title>'; repeatable, alternative to --blogs"
    - long: --no-blogs
      help: "Link no blog posts at all (overrides the default; superfluous, with a warning, alongside --blogs/--blog)"
    - long: --no-goals
      help: Shorthand for --no-badges --no-blogs together
  - name: list
    alias: ls
    help: List all challenges, sorted by start date
    default: force
  - name: get
    help: Show one challenge's details
    args:
    - name: challenge_id
      help: "Challenge id (default: the next one to end, ongoing or planned; else the most recently ended one; error if there are no challenges at all)"
    flags:
    - long: --json
      short: -J
      help: Print the raw JSON instead of a pretty summary
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/challenges" 2>/dev/null | sed "s/\.json$//")'
  - name: edit
    help: "Change a challenge's title, time window, badge-linked blog posts, and/or book-count badges"
    args:
    - name: challenge_id
      required: true
      help: Challenge id
    flags:
    - long: --title
      arg: title
      help: New title
    - long: --start
      arg: date
      help: New start date
    - long: --end
      arg: date
      help: New end date
    - long: --add-blog
      arg: blog_id:name
      repeatable: true
      help: "Add (or rename) a badge-linked blog post, as '<blog_id>' or '<blog_id>:<name>'; repeatable"
      completions:
      - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/blogs" 2>/dev/null | sed "s/\.json$//")'
    - long: --remove-blog
      arg: blog_id
      repeatable: true
      help: Remove a badge-linked blog post; repeatable
    - long: --add-badge
      arg: count:name
      repeatable: true
      help: "Add (or rename) a book-count badge, as '<count>' or '<count>:<name>'; repeatable"
    - long: --remove-badge
      arg: count
      repeatable: true
      help: Remove a book-count badge; repeatable
    completions:
    - '$(ls "${GOODREADS_DATA:-$HOME/.goodreads}/challenges" 2>/dev/null | sed "s/\.json$//")'
  - name: remove
    alias: rm
    help: Remove one or more challenges
    args:
    - name: challenge_id
      repeatable: true
      help: Challenge id(s) to remove
    flags:
    - long: --all
      short: -a
      help: Remove every challenge
- name: config
  help: View or change goodreads' own config.ini settings (curl_bin, throttling, cache TTLs, ...)
  commands:
  - name: list
    alias: ls
    help: List every setting goodreads understands, with its current value (or default)
    default: force
  - name: get
    help: Print one setting's effective value (falls back to its default silently if unset)
    args:
    - name: key
      required: true
      help: Setting name (see 'goodreads config list')
    # Attached to the command, not the arg -- same convention as
    # blogs/books/challenges list|get (see CLAUDE.md).
    completions:
    - 'curl_bin http_request_delay_min http_request_delay_max http_retry_delays book_cache_ttl'
  - name: set
    help: Set a setting's value
    args:
    - name: key
      required: true
      help: Setting name (see 'goodreads config list')
    - name: value
      required: true
      help: New value
    # No completions here -- a command-level block applies to *every*
    # positional arg (confirmed: also hit the value slot), which would
    # wrongly offer key names as values too.
  - name: unset
    help: Unset one or more settings, reverting them to their default
    args:
    - name: key
      repeatable: true
      help: Setting name(s) to unset
    completions:
    - 'curl_bin http_request_delay_min http_request_delay_max http_retry_delays book_cache_ttl'
    flags:
    - long: --all
      short: -a
      help: Unset every currently-set setting
